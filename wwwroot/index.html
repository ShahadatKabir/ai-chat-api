<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Conversation sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <h1>Chat Console</h1>
          <p>Gemini and Gemma API workspace</p>
        </div>
      </div>

      <section class="panel auth-panel" id="authPanel">
        <div class="tabs" role="tablist" aria-label="Authentication mode">
          <button class="tab active" id="loginTab" type="button">Login</button>
          <button class="tab" id="registerTab" type="button">Register</button>
        </div>
        <form id="authForm" class="stack">
          <label>
            Username
            <input id="usernameInput" autocomplete="username" required>
          </label>
          <label id="emailField" class="hidden">
            Email
            <input id="emailInput" type="email" autocomplete="email">
          </label>
          <label>
            Password
            <input id="passwordInput" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit" id="authSubmit">Login</button>
        </form>
      </section>

      <section class="panel user-panel hidden" id="userPanel">
        <div>
          <span class="eyebrow">Signed in</span>
          <strong id="userName">User</strong>
        </div>
        <button class="ghost" type="button" id="logoutButton">Logout</button>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>Sessions</h2>
          <button class="icon-button" type="button" id="newSessionButton" title="New session">+</button>
        </div>
        <div class="session-list" id="sessionList"></div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>Templates</h2>
          <button class="ghost" type="button" id="saveTemplateButton">Save</button>
        </div>
        <input id="templateNameInput" placeholder="Template name">
        <div class="template-list" id="templateList"></div>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <span class="eyebrow">Active session</span>
          <h2 id="activeSessionTitle">Default Conversation</h2>
        </div>
        <div class="actions">
          <a class="ghost link-button" href="/swagger" target="_blank" rel="noreferrer">Swagger</a>
          <button class="ghost" type="button" id="exportJsonButton">JSON</button>
          <button class="ghost" type="button" id="exportCsvButton">CSV</button>
        </div>
      </header>

      <section class="controls" aria-label="Model controls">
        <label>
          Model
          <select id="modelSelect">
            <option value="gemini-pro">Gemini Pro</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            <option value="gemma">Gemma</option>
          </select>
        </label>
        <label>
          Temperature <span id="temperatureValue">0.7</span>
          <input id="temperatureInput" type="range" min="0" max="1" step="0.1" value="0.7">
        </label>
        <label>
          Max tokens
          <input id="tokensInput" type="number" min="64" max="4096" step="64" value="256">
        </label>
      </section>

      <section class="chat" id="chatLog" aria-live="polite"></section>

      <form class="composer" id="chatForm">
        <textarea id="promptInput" rows="3" placeholder="Ask something..." required></textarea>
        <button class="primary send-button" type="submit">Send</button>
      </form>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
